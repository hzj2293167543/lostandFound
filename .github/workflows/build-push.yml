name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_latest:
        description: '是否推送 latest 标签'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "REGISTRY=${{ secrets.DOCKER_REGISTRY }}" >> $GITHUB_OUTPUT

      - name: Build and push PostgreSQL
        uses: docker/build-push-action@v5
        with:
          context: ./docker/postgres
          push: true
          tags: |
            ${{ steps.meta.outputs.REGISTRY }}:postgres-${{ steps.meta.outputs.TAG }}
            ${{ inputs.push_latest == true && format('{0}:postgres', steps.meta.outputs.REGISTRY) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Ollama
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ollama
          push: true
          tags: |
            ${{ steps.meta.outputs.REGISTRY }}:ollama-${{ steps.meta.outputs.TAG }}
            ${{ inputs.push_latest == true && format('{0}:ollama', steps.meta.outputs.REGISTRY) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.REGISTRY }}:backend-${{ steps.meta.outputs.TAG }}
            ${{ inputs.push_latest == true && format('{0}:backend', steps.meta.outputs.REGISTRY) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.REGISTRY }}:frontend-${{ steps.meta.outputs.TAG }}
            ${{ inputs.push_latest == true && format('{0}:frontend', steps.meta.outputs.REGISTRY) || '' }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_WS_URL=${{ secrets.VITE_WS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "✅ Docker 镜像构建并推送完成！"
          echo ""
          echo "镜像标签："
          echo "  - ${{ steps.meta.outputs.REGISTRY }}:postgres-${{ steps.meta.outputs.TAG }}"
          echo "  - ${{ steps.meta.outputs.REGISTRY }}:ollama-${{ steps.meta.outputs.TAG }}"
          echo "  - ${{ steps.meta.outputs.REGISTRY }}:backend-${{ steps.meta.outputs.TAG }}"
          echo "  - ${{ steps.meta.outputs.REGISTRY }}:frontend-${{ steps.meta.outputs.TAG }}"
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            echo ""
            echo "Latest 标签："
            echo "  - ${{ steps.meta.outputs.REGISTRY }}:postgres"
            echo "  - ${{ steps.meta.outputs.REGISTRY }}:ollama"
            echo "  - ${{ steps.meta.outputs.REGISTRY }}:backend"
            echo "  - ${{ steps.meta.outputs.REGISTRY }}:frontend"
          fi
