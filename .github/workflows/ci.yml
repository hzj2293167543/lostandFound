name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v2
            - uses: actions/setup-node@v4
              with:
                  node-version: 23
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm run lint:quick
            - run: pnpm run lint:deep

    test:
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v2
            - uses: actions/setup-node@v4
              with:
                  node-version: 23
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: npx playwright install chromium # 安装浏览器
            - run: pnpm run test:run # 统一测试

    build:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v2
            - uses: actions/setup-node@v4
              with:
                  node-version: 23
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: packages/*/dist/
