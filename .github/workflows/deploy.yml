name: Deploy to Server

on:
  push:
    branches: ['master']
  workflow_dispatch:
    inputs:
      # deploy_target:
      #   description: '部署目标 (postgres|ollama|frontend|backend|all)'
      #   required: false
      #   default: 'all'
      #   type: choice
      #   options:
      #     - all
      #     - postgres
      #     - ollama
      #     - frontend
      #     - backend
      clean_db:
        description: '清除数据库'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY }}

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy files
        run: |
          mkdir -p deploy
          cp docker-deploy/docker-compose.prod.yml deploy/

          cat > deploy/.env << 'ENVEOF'
          REGISTRY=${{ secrets.DOCKER_REGISTRY }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          BACKEND_URL=${{ secrets.BACKEND_URL }}
          WS_URL=${{ secrets.WS_URL }}
          STATIC_BASE_URL=${{ secrets.STATIC_BASE_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
          CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
          AI_LLM_MODEL=${{ secrets.AI_LLM_MODEL }}
          AI_LLM_API_KEY=${{ secrets.AI_LLM_API_KEY }}
          AI_LLM_CHAT_URL=${{ secrets.AI_LLM_CHAT_URL }}
          AI_LLM_SEARCH_URL=${{ secrets.AI_LLM_SEARCH_URL }}
          AI_OLLAMA_MODEL=${{ secrets.AI_OLLAMA_MODEL }}
          AI_OLLAMA_URL=${{ secrets.AI_OLLAMA_URL }}
          ENVEOF

      - name: Copy files to server via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: 'deploy/*'
          target: '~/lostfound/'
          strip_components: 1

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ~/lostfound

            echo "[INFO] 备份当前配置..."
            if [ -f docker-compose.prod.yml ]; then
              cp docker-compose.prod.yml docker-compose.prod.yml.bak
            fi

            echo "[INFO] 部署目标: ${{ inputs.deploy_target || 'all' }}"
            echo "[INFO] 清除数据库: ${{ inputs.clean_db || 'false' }}"

            echo "[INFO] 拉取最新镜像..."
            if ! docker compose -f docker-compose.prod.yml pull; then
              echo "[ERROR] 拉取镜像失败，中止部署"
              exit 1
            fi

            echo "[INFO] 停止旧容器..."
            docker compose -f docker-compose.prod.yml down

            if [ "${{ inputs.clean_db }}" == "true" ]; then
              echo "[INFO] 清除数据库..."
              docker volume rm lostfound_postgres_data 2>/dev/null || true
            fi

            echo "[INFO] 启动新容器..."
            docker compose -f docker-compose.prod.yml up -d

            echo "[INFO] 检查容器状态..."
            docker compose -f docker-compose.prod.yml ps

            echo "[INFO] 部署完成！"
