name: Deploy

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        needs: [lint, test, build] # CI 全通过才部署
        steps:
            - uses: actions/checkout@v4

            # 下载 CI 构建的产物
            - uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist/

            # 部署到服务器（示例：SCP 上传）
            - uses: appleboy/scp-action@v0.1.4
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  password: ${{ secrets.PASSWORD }}
                  source: 'dist/*'
                  target: '/var/www/html'

            # 或部署到 Vercel/Netlify
            # - uses: amondnet/vercel-action@v25
