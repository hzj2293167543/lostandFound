name: Docker Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: '部署目标'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - backend
          - postgres
          - ollama
      clean_db:
        description: '是否清除数据库卷'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. CI 检查（复用现有 CI 工作流）
  ci-check:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # 2. 构建并推送 Docker 镜像
  build-and-push:
    runs-on: ubuntu-latest
    needs: ci-check
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag
        id: vars
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "REGISTRY=${{ secrets.DOCKER_REGISTRY }}" >> $GITHUB_OUTPUT

      - name: Build and push PostgreSQL
        uses: docker/build-push-action@v5
        with:
          context: ./docker/postgres
          push: true
          tags: |
            ${{ steps.vars.outputs.REGISTRY }}:postgres
            ${{ steps.vars.outputs.REGISTRY }}:postgres-${{ steps.vars.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Ollama
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ollama
          push: true
          tags: |
            ${{ steps.vars.outputs.REGISTRY }}:ollama
            ${{ steps.vars.outputs.REGISTRY }}:ollama-${{ steps.vars.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.REGISTRY }}:backend
            ${{ steps.vars.outputs.REGISTRY }}:backend-${{ steps.vars.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.REGISTRY }}:frontend
            ${{ steps.vars.outputs.REGISTRY }}:frontend-${{ steps.vars.outputs.TAG }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_WS_URL=${{ secrets.VITE_WS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. 部署到服务器
  deploy-to-server:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy files
        run: |
          mkdir -p deploy
          cp docker-deploy/docker-compose.prod.yml deploy/
          cp docker-deploy/deploy.sh deploy/
          cp -r docker-deploy/public deploy/ 2>/dev/null || true

      - name: Create .env file
        run: |
          cat > deploy/.env << EOF
          REGISTRY=${{ secrets.DOCKER_REGISTRY }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          BACKEND_URL=${{ secrets.BACKEND_URL }}
          WS_URL=${{ secrets.WS_URL }}
          STATIC_BASE_URL=${{ secrets.STATIC_BASE_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
          CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
          AI_LLM_MODEL=${{ secrets.AI_LLM_MODEL }}
          AI_LLM_API_KEY=${{ secrets.AI_LLM_API_KEY }}
          AI_LLM_CHAT_URL=${{ secrets.AI_LLM_CHAT_URL }}
          AI_LLM_SEARCH_URL=${{ secrets.AI_LLM_SEARCH_URL }}
          AI_OLLAMA_MODEL=${{ secrets.AI_OLLAMA_MODEL }}
          AI_OLLAMA_URL=${{ secrets.AI_OLLAMA_URL }}
          EOF

      - name: Upload deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-files
          path: deploy/

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/lostfound

            # 备份当前配置
            if [ -f docker-compose.prod.yml ]; then
              cp docker-compose.prod.yml docker-compose.prod.yml.bak
            fi

            # 创建临时目录
            rm -rf /tmp/lostfound-deploy
            mkdir -p /tmp/lostfound-deploy

            echo "[INFO] 部署目标: ${{ inputs.deploy_target || 'all' }}"
            echo "[INFO] 清除数据库: ${{ inputs.clean_db || 'false' }}"

      - name: Final deploy (clean or all)
        uses: appleboy/ssh-action@v1.0.3
        if: inputs.clean_db == true
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/lostfound
            echo "[INFO] 执行清除模式部署..."
            chmod +x deploy.sh
            ./deploy.sh clean

      - name: Final deploy (specific target)
        uses: appleboy/ssh-action@v1.0.3
        if: inputs.clean_db != true && inputs.deploy_target != 'all'
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/lostfound
            echo "[INFO] 执行 ${{ inputs.deploy_target }} 部署..."
            chmod +x deploy.sh
            ./deploy.sh ${{ inputs.deploy_target }}

      - name: Final deploy (all)
        uses: appleboy/ssh-action@v1.0.3
        if: inputs.clean_db != true && (inputs.deploy_target == 'all' || inputs.deploy_target == '')
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/lostfound
            echo "[INFO] 执行全部部署..."
            chmod +x deploy.sh
            ./deploy.sh all

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/lostfound
            echo "[INFO] 检查容器状态..."
            docker compose -f docker-compose.prod.yml ps
            echo "[INFO] 部署完成！"
